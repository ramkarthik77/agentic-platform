name: AAAEM checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aaaem
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: aaaem_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aaaem -d aaaem_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - run: node --check web/assets/app.js
      - run: python -m compileall -q backend scripts
      - run: python -m pytest
        env:
          AAAEM_TEST_POSTGRES_URL: postgresql+psycopg://aaaem:test-only@localhost:5432/aaaem_test
