name: AAAEM checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aaaem
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: aaaem_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aaaem -d aaaem_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - run: node --check web/assets/app.js
      - run: python -m compileall -q backend scripts
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest
        env:
          AAAEM_TEST_POSTGRES_URL: postgresql+psycopg://aaaem:test-only@localhost:5432/aaaem_test
          AAAEM_BROWSER_TESTS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
          if-no-files-found: ignore
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
      - run: terraform -chdir=infra/aws fmt -check
      - run: terraform -chdir=infra/aws init -backend=false
      - run: terraform -chdir=infra/aws validate
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t aaaem-app:ci .
      - run: |
          docker run -d --name aaaem-app -p 127.0.0.1:18000:8000 aaaem-app:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/healthz; then exit 0; fi
            sleep 2
          done
          docker logs aaaem-app
          exit 1
      - run: docker build -f Dockerfile.verifier -t aaaem-verifier:ci .
      - run: |
          docker run --rm aaaem-verifier:ci python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(); print(b.version); b.close(); p.stop()"
